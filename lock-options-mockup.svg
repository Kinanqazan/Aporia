<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>text{font-family:Segoe UI,Arial;fill:#37352f}.title{font-size:30px;font-weight:700}.head{font-size:24px;font-weight:700}.sub{font-size:17px;fill:#77746f}.state{font-size:14px;fill:#88847e;font-weight:700}.page{font-size:22px;font-weight:600}.label{font-size:17px;font-weight:600}.icon{fill:none;stroke:#37352f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><g id="closed" class="icon"><rect x="5" y="13" width="22" height="17" rx="3"/><path d="M9 13V9a7 7 0 0 1 14 0v4"/><path d="M16 20v3"/></g><g id="open" class="icon"><rect x="5" y="13" width="22" height="17" rx="3"/><path d="M10 13V9a7 7 0 0 1 14 0"/><path d="M16 20v3"/></g><g id="page"><rect width="474" height="135" rx="10" fill="#faf9f7" stroke="#efeeeb"/><text x="18" y="39" class="page">My page</text><path d="M18 70h249 M18 86h209" stroke="#e6e4df" stroke-width="3"/></g></defs>
<rect width="1200" height="650" fill="#f4f3f1"/><text x="52" y="60" class="title">Lock control: two visual options</text><text x="52" y="91" class="sub">Illustrative mockups · both states shown</text>
<g transform="translate(45 120)"><rect width="530" height="490" rx="16" fill="white" stroke="#e1dfdb"/><text x="28" y="43" class="head">1  Soft background</text><text x="28" y="72" class="sub">Compact and subtle</text><text x="28" y="111" class="state">UNLOCKED</text><use href="#page" x="28" y="125"/><rect x="450" y="140" width="52" height="44" rx="22" fill="white" stroke="#d4d2cd"/><use href="#open" x="460" y="146"/><text x="28" y="302" class="state">LOCKED</text><use href="#page" x="28" y="316"/><rect x="450" y="331" width="52" height="44" rx="22" fill="white" stroke="#d4d2cd"/><circle cx="476" cy="353" r="19" fill="#e3ebe5"/><use href="#closed" x="460" y="337"/></g>
<g transform="translate(625 120)"><rect width="530" height="490" rx="16" fill="white" stroke="#e1dfdb"/><text x="28" y="43" class="head">2  State label</text><text x="28" y="72" class="sub">More explicit</text><text x="28" y="111" class="state">UNLOCKED</text><use href="#page" x="28" y="125"/><rect x="357" y="140" width="145" height="44" rx="22" fill="white" stroke="#d4d2cd"/><use href="#open" x="367" y="146"/><text x="402" y="168" class="label">Unlocked</text><text x="28" y="302" class="state">LOCKED</text><use href="#page" x="28" y="316"/><rect x="357" y="331" width="145" height="44" rx="22" fill="#e8eee9" stroke="#d4d2cd"/><use href="#closed" x="367" y="337"/><text x="402" y="359" class="label">Locked</text></g></svg>
