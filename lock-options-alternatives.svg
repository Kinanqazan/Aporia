<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>text{font-family:Segoe UI,Arial;fill:#37352f}.title{font-size:30px;font-weight:700}.head{font-size:24px;font-weight:700}.sub{font-size:17px;fill:#77746f}.state{font-size:14px;fill:#88847e;font-weight:700}.page{font-size:22px;font-weight:600}.icon{fill:none;stroke:#37352f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><g id="closed" class="icon"><rect x="5" y="13" width="22" height="17" rx="3"/><path d="M9 13V9a7 7 0 0 1 14 0v4"/><path d="M16 20v3"/></g><g id="filled"><path d="M9 13V9a7 7 0 0 1 14 0v4" fill="none" stroke="#37352f" stroke-width="2.4"/><rect x="5" y="13" width="22" height="17" rx="3" fill="#37352f"/><path d="M16 19v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g><g id="open" class="icon"><rect x="5" y="13" width="22" height="17" rx="3"/><path d="M10 13V9a7 7 0 0 1 14 0"/><path d="M16 20v3"/></g><g id="page"><rect width="474" height="135" rx="10" fill="#faf9f7" stroke="#efeeeb"/><text x="18" y="39" class="page">My page</text><path d="M18 70h249 M18 86h209" stroke="#e6e4df" stroke-width="3"/></g><g id="button"><rect width="52" height="44" rx="22" fill="white" stroke="#d4d2cd"/></g></defs>
<rect width="1200" height="650" fill="#f4f3f1"/><text x="52" y="60" class="title">Lock control: two more options</text><text x="52" y="91" class="sub">Illustrative mockups · both states shown</text>
<g transform="translate(45 120)"><rect width="530" height="490" rx="16" fill="white" stroke="#e1dfdb"/><text x="28" y="43" class="head">1  Filled lock</text><text x="28" y="72" class="sub">A stronger icon when locked</text><text x="28" y="111" class="state">UNLOCKED</text><use href="#page" x="28" y="125"/><use href="#button" x="450" y="140"/><use href="#open" x="460" y="146"/><text x="28" y="302" class="state">LOCKED</text><use href="#page" x="28" y="316"/><use href="#button" x="450" y="331"/><use href="#filled" x="460" y="337"/></g>
<g transform="translate(625 120)"><rect width="530" height="490" rx="16" fill="white" stroke="#e1dfdb"/><text x="28" y="43" class="head">2  Indicator dot</text><text x="28" y="72" class="sub">A small dot appears when locked</text><text x="28" y="111" class="state">UNLOCKED</text><use href="#page" x="28" y="125"/><use href="#button" x="450" y="140"/><use href="#open" x="460" y="146"/><text x="28" y="302" class="state">LOCKED</text><use href="#page" x="28" y="316"/><use href="#button" x="450" y="331"/><use href="#closed" x="457" y="337"/><circle cx="491" cy="342" r="3.5" fill="#b28b55"/></g></svg>
